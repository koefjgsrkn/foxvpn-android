
name: FOXVPN Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract FOXVPN source
        run: |
          unzip -q FOXVPN-Android-Source.zip -d /tmp/foxvpn
          cp -R /tmp/foxvpn/FOXVPN-Android/. .

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FOXVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
